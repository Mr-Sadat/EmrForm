<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav
               [mode]="isMobile ? 'over' : 'side'"
               [opened]="false">
    <app-side-nav (siderclose)="sidenav.close()"></app-side-nav>
  </mat-sidenav>

  <mat-sidenav-content>

    <app-header
      *ngIf="router.url !== '/login'"
      (sideropen)="sidenav.toggle()">
    </app-header>

    <main>
      <router-outlet ></router-outlet>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
